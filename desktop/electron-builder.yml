appId: com.mayobuild.studio
productName: Mayobuild Studio
copyright: © 2026 Mayobuild
directories:
  output: release
  buildResources: ../public
files:
  - main.cjs
  - preload.cjs
  - native-export.cjs
  - media-tool-paths.cjs
  - package.json
# The web bundle is a REAL folder next to app.asar (not inside it): main.cjs
# serves it over a local http server, and keeping the big wasm/onnx assets
# out of the asar avoids slow asar reads and path-resolution traps.
extraResources:
  - from: ../app-shell-dist
    to: app-shell-dist
asar: true
beforePack: ./stage-media-tools.cjs
win:
  extraResources:
    - from: media-tools/win-x64
      to: media-tools
    - from: third-party
      to: third-party
  target:
    - target: nsis
      arch:
        - x64
  icon: icons/icon-512.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: mayobuild-studio-setup-${version}.exe
linux:
  target:
    - AppImage
  icon: icons/icon-512.png
  category: Multimedia
mac:
  category: public.app-category.video
