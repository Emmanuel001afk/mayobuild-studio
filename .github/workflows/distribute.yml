# Builds the MayoCut binaries (Windows .exe + Android .apk) from the single
# codebase and attaches them to a GitHub Release.
#
# Trigger manually:  Actions → distribute → Run workflow
#   release: tag of an EXISTING release (e.g. mayocut-v0.1.0)
# Or push a tag:  mc-0.2.0  (a release with that tag must exist first,
# or it will be created below).
name: distribute

on:
  workflow_dispatch:
    inputs:
      release:
        description: "GitHub release tag to attach the binaries to"
        required: true
        default: "mayocut-v0.1.0"
  push:
    tags:
      - "mc-*"

permissions:
  contents: write

concurrency:
  group: distribute
  cancel-in-progress: false

jobs:
  shell:
    name: Build static shell
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build:shell
      - uses: actions/upload-artifact@v4
        with:
          name: app-shell-dist
          path: app-shell-dist

  windows:
    name: Windows .exe (NSIS)
    runs-on: ubuntu-latest
    needs: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: app-shell-dist
      # --ignore-scripts: electron's postinstall binary download is handled by
      # electron-builder itself during the build step below.
      - run: npm --prefix desktop ci --ignore-scripts
      - run: cd desktop && npx electron-builder --win --x64
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MayoCut $TAG" --notes "MayoCut video editor — $TAG" --target "$GITHUB_SHA"
          gh release upload "$TAG" desktop/release/*.exe --clobber

  android:
    name: Android .apk
    runs-on: ubuntu-latest
    needs: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: app-shell-dist
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: mayocut-android-${{ needs.shell.outputs.version }}.apk
        run: |
          TAG="${{ github.event.inputs.release || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MayoCut $TAG" --notes "MayoCut video editor — $TAG" --target "$GITHUB_SHA"
          cp android/app/build/outputs/apk/debug/app-debug.apk "./$APK_NAME"
          gh release upload "$TAG" "./$APK_NAME" --clobber
