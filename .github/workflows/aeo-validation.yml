name: AEO adapter validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run AEO trust-bundle tests
        run: bun test src/lib/aeo/membership.test.ts src/lib/aeo/trust-bundle.test.ts
      - name: Type-check AEO membership and trust-bundle adapters
        run: bunx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM src/lib/aeo/membership.ts src/lib/aeo/trust-bundle.ts
      - name: Build application
        run: bun run build
