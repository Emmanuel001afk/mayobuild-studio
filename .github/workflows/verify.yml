# Renders the ACTUAL binaries and fails if they are blank — "see the APK and
# the EXE" as automated proof, with screenshots attached as artifacts.
#
#   - Windows: builds the NSIS/unpacked app, launches the packaged Electron
#     binary with a CDP endpoint, asserts the DOM has real content,
#     screenshots it (scripts/verify-electron.mjs).
#   - Android: builds the debug APK, installs it on a real API-35 emulator
#     (reactivecircus/android-emulator-runner), launches the app, screenshots
#     it and asserts the screenshot is not a blank frame.
#
# Triggers on the same mc-* tags as distribute (runs alongside it) and can be
# run manually.
name: verify

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "android/**"
      - "desktop/**"
      - "shell/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/verify.yml"
    tags:
      - "mc-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Build static shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shell
      - uses: actions/upload-artifact@v4
        with:
          name: app-shell-dist
          path: app-shell-dist
          retention-days: 7

  verify-windows:
    name: Launch packaged EXE + verify render
    runs-on: windows-latest
    needs: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: app-shell-dist
          path: app-shell-dist
      - run: npm --prefix desktop ci
      - run: cd desktop && npx electron-builder --win --x64
      - name: Verify bundled media tools and native rendering
        shell: pwsh
        run: |
          $env:MAYOCUT_TEST_FFMPEG = "$PWD/desktop/release/win-unpacked/resources/media-tools/ffmpeg.exe"
          $env:MAYOCUT_TEST_FFPROBE = "$PWD/desktop/release/win-unpacked/resources/media-tools/ffprobe.exe"
          if (!(Test-Path $env:MAYOCUT_TEST_FFMPEG) -or !(Test-Path $env:MAYOCUT_TEST_FFPROBE)) { throw "Bundled FFmpeg or FFprobe missing" }
          & $env:MAYOCUT_TEST_FFMPEG -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:MAYOCUT_TEST_FFPROBE -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/native-export.test.cjs tests/media-tool-paths.test.cjs tests/native-proxy.test.cjs tests/legacy-storage.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch + CDP render check
        shell: pwsh
        working-directory: desktop
        env:
          MAYOBUILD_CDP: "9222"
          VERIFY_OUT: verify-desktop.png
        run: |
          $exe = Get-ChildItem "$PWD\release\win-unpacked" -Filter "*.exe" | Select-Object -First 1
          Write-Host "launching $($exe.FullName)"
          Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName
          node "$PWD\..\scripts\verify-electron.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify projects and media survive a desktop restart
        shell: pwsh
        working-directory: desktop
        env:
          MAYOBUILD_CDP: "9222"
        run: |
          node "$PWD\..\scripts\verify-desktop-persistence.mjs" write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $running = @(Get-Process mayobuild* -ErrorAction SilentlyContinue)
          if ($running.Count -gt 0) { $running | Stop-Process -Force -PassThru | Wait-Process -Timeout 30 }
          $exe = Get-ChildItem "$PWD\release\win-unpacked" -Filter "*.exe" | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName
          node "$PWD\..\scripts\verify-desktop-persistence.mjs" read
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Kill electron
        shell: pwsh
        run: Get-Process mayobuild* -ErrorAction SilentlyContinue | Stop-Process -Force
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: verify-windows
          path: desktop/verify-desktop.png
          if-no-files-found: warn
          retention-days: 14

  verify-android:
    name: Install APK on API-35 emulator + verify render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: app-shell-dist
          path: app-shell-dist
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-verbose-logging: true
          disable-animations: true
          boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none -camera-front none
          install-apk: android/app/build/outputs/apk/debug/app-debug.apk
          script: |
            set -e
            # launch the app's main activity
            ACTIVITY=$(adb shell cmd package resolve-activity --brief com.mayobuild.studio | tail -1 | tr -d '\r')
            echo "launching $ACTIVITY"
            adb shell am start -n "$ACTIVITY"
            # give the SPA time to render (big bundle on an emulated GPU)
            sleep 45
            adb shell screencap -p /sdcard/verify-android.png
            adb pull /sdcard/verify-android.png ./verify-android.png
            # focused window must be our app
            adb shell dumpsys window | grep -E "mCurrentFocus" || true
            # blank-screen heuristic: a rendered UI screenshot has far more
            # bytes than a flat-color frame (PNG compresses flat fills hard)
            SIZE=$(stat -c%s ./verify-android.png || wc -c < ./verify-android.png)
            echo "screenshot bytes: $SIZE"
            if [ "$SIZE" -lt 40000 ]; then
              echo "VERIFY-ANDROID FAIL: screenshot too small — likely a blank/flat frame"
              exit 1
            fi
            echo "VERIFY-ANDROID PASS — APK installed, launched, non-blank frame captured"
      - uses: actions/upload-artifact@v4
        with:
          name: verify-android
          path: verify-android.png
          if-no-files-found: warn
          retention-days: 14
