# MayoCut logic audit + real render smoke tests.
#
# Runs on every push/PR that touches the editor:
#   1. audit.mjs — 75 pure-logic assertions over types / engine / LUTs /
#      captions / assist / device gating (freeze frames, transitions, splits,
#      keyframes, colour grading, speed math, template packs).
#   2. build the production shell bundle.
#   3. smoke-shell — the bundle actually boots and renders "/" and "/mayocut".
#   4. smoke-editor — the EDITOR route mounts with a seeded project and every
#      new surface (beats, freeze, transitions, ducking, aspect picker).
#
# A green build alone is not proof the app works; these steps assert it renders.
name: audit

on:
  push:
    branches: ["**"]
    paths:
      - "src/mayocut/**"
      - "scripts/smoke-*.mjs"
      - "scripts/pixel-render.mjs"
      - ".diag/**"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "src/mayocut/**"
      - ".diag/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint (mayocut only)
        run: npx eslint src/mayocut src/routes/mayocut

      - name: Rebuild pure-logic bundles, then audit
        run: node scripts/audit-build.mjs

      # Real encoded footage, not synthetic canvases. Runs in plain node: the
      # container is parsed directly, so this needs no browser.
      - name: Real-footage fixture bench
        run: |
          bash scripts/make-fixtures.sh --check
          node scripts/fixture-bench.mjs

      # A real Skia canvas in plain node. Everything before this asserts wiring;
      # this asserts PIXELS, which is the only way to catch a curve that is read,
      # stored, plotted — and then never applied.
      - name: Pixel-level render verification
        run: |
          npm install --no-save --ignore-scripts @napi-rs/canvas
          node scripts/pixel-render.mjs

      - name: Build offline shell bundle
        run: npm run build:shell

      - name: Render smoke (home + /mayocut)
        run: |
          npm install --no-save --ignore-scripts happy-dom fake-indexeddb
          node scripts/smoke-shell.mjs /
          node scripts/smoke-shell.mjs /mayocut
          node scripts/smoke-editor.mjs
